{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Speech Interface</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v={{ version }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="header">
        <h1 class="strong-heading">Comm AI</h1>
    </div>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <!-- Chat messages will be appended here -->
        </div>
    </div>

    <button class="speech-button" id="pulse" onclick="startRecognition()">
        <i class="fa-solid fa-microphone-slash" id="mic-icon"></i>
    </button>

    <!-- Hidden form for conversation submission -->
    <form id="submit-form" action="{% url 'results' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="conversation" id="conversation-data">
        <button type="submit" class="submit-button">Submit Conversation</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const chatBox = document.getElementById("chatBox");
            const conversationData = document.getElementById("conversation-data");
            const submitForm = document.getElementById("submit-form");

            let conversation = [];

            // Append message to chat UI
            function appendMessage(sender, message) {
                const messageDiv = document.createElement("div");
                messageDiv.classList.add("chat-message", sender.toLowerCase());
                messageDiv.textContent = message;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // Handle recognized speech text
            function handleSpeechResult(text) {
                if (!text.trim()) return;

                // Add user message
                appendMessage("User", text);
                conversation.push({ sender: "User", text: text });

                // Send to backend
                fetch("{% url 'ask' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": "{{ csrf_token }}"
                    },
                    body: JSON.stringify({ message: text, conversation: conversation })
                })
                    .then(response => response.json())
                    .then(data => {
                        // Add AI response
                        appendMessage("AI", data.response);
                        conversation.push({ sender: "AI", text: data.response });

                        // Keep hidden input updated
                        conversationData.value = JSON.stringify(conversation);
                    })
                    .catch(error => console.error("Error:", error));
            }

            // Update hidden input on form submit
            submitForm.addEventListener("submit", function () {
                conversationData.value = JSON.stringify(conversation);
            });

            // Expose function globally so speech recognition script can call it
            window.handleSpeechResult = handleSpeechResult;
        });

        // ================================
        // ElevenLabs Realtime Speech STT
        // ================================

        let ws = null;
        let audioContext = null;
        let processor = null;
        let input = null;

        async function startRecognition() {

            const micIcon = document.getElementById("mic-icon");

            micIcon.classList.remove("fa-microphone-slash");
            micIcon.classList.add("fa-microphone");

            try {

                // get temporary token from backend
                const response = await fetch("/elevenlabs_token/");
                const tokenData = await response.json();
                const token = tokenData.token;

                if (!token) {
                    console.error("No ElevenLabs token received");
                    return;
                }

                // create websocket
                ws = new WebSocket(
                    `wss://api.elevenlabs.io/v1/speech-to-text/realtime?token=${token}&model_id=scribe_v2_realtime`
                );

                // ==========================
                // OPEN CONNECTION
                // ==========================
                ws.onopen = async () => {

                    console.log("Connected to ElevenLabs STT");

                    // get microphone
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    audioContext = new AudioContext({ sampleRate: 16000 });

                    input = audioContext.createMediaStreamSource(stream);

                    processor = audioContext.createScriptProcessor(2048, 1, 1);

                    processor.onaudioprocess = (event) => {

                        if (!ws || ws.readyState !== WebSocket.OPEN) return;

                        const pcmData = event.inputBuffer.getChannelData(0);

                        const int16Buffer = convertFloat32ToInt16(pcmData);

                        const base64Audio = arrayBufferToBase64(int16Buffer.buffer);

                        ws.send(JSON.stringify({
                            message_type: "input_audio_buffer.append",
                            audio_base64: base64Audio
                        }));
                    };

                    input.connect(processor);
                    processor.connect(audioContext.createGain());
                };

                // ==========================
                // RECEIVE TRANSCRIPT
                // ==========================
                ws.onmessage = (event) => {

                    const data = JSON.parse(event.data);

                    if (data.message_type === "transcript_partial") {
                        console.log("Partial:", data.text);
                    }

                    if (data.message_type === "transcript_final") {
                        console.log("Final:", data.text);

                        if (window.handleSpeechResult) {
                            window.handleSpeechResult(data.text);
                        }
                    }

                    console.log("WS message:", data);
                };

                // ==========================
                // ERROR
                // ==========================
                ws.onerror = (err) => {
                    console.error("STT WebSocket error:", err);
                };

                // ==========================
                // CLOSED
                // ==========================
                ws.onclose = (event) => {

                    console.log("STT connection closed", event);

                    micIcon.classList.remove("fa-microphone");
                    micIcon.classList.add("fa-microphone-slash");

                    stopRecognition();
                };

            } catch (err) {
                console.error("STT startup error:", err);
            }
        }


        // ================================
        // STOP RECOGNITION
        // ================================
        function stopRecognition() {

            if (processor) {
                processor.disconnect();
                processor = null;
            }

            if (input) {
                input.disconnect();
                input = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {

                ws.send(JSON.stringify({
                    message_type: "input_audio_buffer.commit"
                }));

                ws.close();
            }

            ws = null;
        }


        // ================================
        // FLOAT → INT16 CONVERSION
        // ================================
        function convertFloat32ToInt16(buffer) {

            const l = buffer.length;
            const buf = new Int16Array(l);

            for (let i = 0; i < l; i++) {
                buf[i] = Math.min(1, buffer[i]) * 0x7fff;
            }

            return buf;
        }


        // ================================
        // ARRAYBUFFER → BASE64
        // ================================
        function arrayBufferToBase64(buffer) {

            let binary = "";
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;

            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }

            return btoa(binary);
        }
    
    </script>
</body>

</html>
